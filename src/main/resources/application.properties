spring.application.name=AICAttendanceSystem

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/aic_attendance
spring.datasource.username=postgres
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- profiles
# "dev" also enables HTTP Basic so the API can be exercised in Postman.
spring.profiles.active=dev

# ------------------------------------------------------------ access control
# The first administrator, created on startup if it does not exist.
app.admin.email=${ADMIN_EMAIL:admin@auca.ac.rw}
app.admin.name=${ADMIN_NAME:System Administrator}
app.seed-demo-data=true

# Development sign-in only (dev profile). No per-user password is ever stored;
# in production the only way in is OAuth2. See DevUserDetailsService.
app.dev.password=aic-dev-2026

# ------------------------------------------------------------------- OAuth2
# Google sign-in lives in application-google.properties. Activate it with
#   --spring.profiles.active=dev,google
# once GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set in the environment.

# ------------------------------------------------------------------ MongoDB
# Notification log and audit trail. Started with: docker compose up -d
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aicattendance}

# ----------------------------------------------------------------- RabbitMQ
# Started with: docker compose up -d   Management UI: http://localhost:15672
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# A failed notification is retried three times with backoff, then dead-lettered.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Which email domain may sign in. Leave empty to accept any address, which is
# useful when demonstrating with a personal Google account.
app.allowed-domain=@auca.ac.rw

# ------------------------------------------------------------------- outbox
# Events are written to the outbox in the same transaction as the attendance
# record, then drained to RabbitMQ by a scheduled job. An outage delays an
# alert; it no longer loses it.
app.outbox.poll-interval-ms=1000
app.outbox.max-attempts=10
