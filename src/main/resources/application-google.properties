# Google OAuth2 sign-in.
#
# Create the credentials at https://console.cloud.google.com/apis/credentials
#   Application type:           Web application
#   Authorised redirect URI:    http://localhost:8080/login/oauth2/code/google
#
# Then export the two values and start with the profile active:
#   export GOOGLE_CLIENT_ID=...
#   export GOOGLE_CLIENT_SECRET=...
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,google
#
# The secret is never committed; only the environment variable name appears here.

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# The React app runs on its own port in development, so once Google has signed
# the user in, send the browser back there rather than leaving it on the API.
app.frontend-url=http://localhost:5173/
