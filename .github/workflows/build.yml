# Runs on every push and pull request, so the behaviour the report describes
# is re-checked rather than taken on trust.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:

  backend:
    name: API and tests
    runs-on: ubuntu-latest

    # DatabaseConstraintsTest deliberately uses a real PostgreSQL: a constraint
    # is a property of the engine, so checking it on an embedded database would
    # be testing the wrong thing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicattendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run the tests
        run: mvn -B test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/aicattendance_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Package
        run: mvn -B -DskipTests package

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
